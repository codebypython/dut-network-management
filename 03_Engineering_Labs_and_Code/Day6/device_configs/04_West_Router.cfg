! ==========================================
! THIẾT BỊ: ROUTER WEST (ASBR: EIGRP AS 66 <-> EIGRP AS 99)
! PHÂN VÙNG: BIÊN PHÍA TÂY & KIỂM SOÁT BẢO MẬT ACL 101
! ==========================================
enable
configure terminal
hostname West

! 1. Cổng Loopback2 đại diện nhánh mạng LAN2 (8000 nodes -> /19, Áp dụng ACL 101)
interface Loopback2
 ip address 172.21.32.1 255.255.224.0
 ip access-group 101 in
 no shutdown
exit

! 2. Bật cổng vật lý Gig0/0 nối Switch Server (Trunk 802.1Q)
interface GigabitEthernet0/0
 no ip address
 duplex auto
 speed auto
 no shutdown
exit

! 3. Sub-interfaces Inter-VLAN (thuộc vùng EIGRP AS 99)
interface GigabitEthernet0/0.2
 encapsulation dot1Q 2
 ip address 172.22.32.1 255.255.240.0
 no shutdown
exit

interface GigabitEthernet0/0.3
 encapsulation dot1Q 3
 ip address 172.22.48.1 255.255.240.0
 no shutdown
exit

! 4. Cổng Serial0/3/0 nối WestGate (EIGRP AS 66 WAN /30, DTE)
interface Serial0/3/0
 ip address 172.21.255.2 255.255.255.252
 no shutdown
exit

! 5. Cấu hình EIGRP AS 66 & Tái phân phối từ EIGRP 99 sang
router eigrp 66
 redistribute eigrp 99 metric 10000 100 255 1 1500
 network 172.21.0.0
 no auto-summary
exit

! 6. Tuyến tĩnh trỏ sang WestGate để tái phân phối Default Route vào EIGRP 99
ip route 0.0.0.0 0.0.0.0 172.21.255.1

! 7. Cấu hình EIGRP AS 99, Tái phân phối từ EIGRP 66 & Bơm Tuyến Ngầm Định Vào Core
router eigrp 99
 redistribute eigrp 66 metric 10000 100 255 1 1500
 redistribute static metric 10000 100 255 1 1500
 network 172.22.0.0
 network 172.22.32.0 0.0.15.255
 network 172.22.48.0 0.0.15.255
 no auto-summary
exit

! 8. Cấu hình Extended ACL 101 theo Yêu cầu 8 của đề
! - Cho phép lưu lượng HTTP (TCP 80) và TELNET (TCP 23) 2 chiều sang VLAN 'east' (172.22.48.0/20)
access-list 101 permit tcp 172.21.32.0 0.0.31.255 172.22.48.0 0.0.15.255 eq www
access-list 101 permit tcp 172.21.32.0 0.0.31.255 172.22.48.0 0.0.15.255 eq telnet
! - Chặn gói Ping (ICMP Echo) từ LAN2 sang VLAN 'east'
access-list 101 deny icmp 172.21.32.0 0.0.31.255 172.22.48.0 0.0.15.255 echo
! - Cho phép tất cả các lưu lượng khác (ping Internet, ping VLAN west, DNS,...)
access-list 101 permit ip any any

do write
