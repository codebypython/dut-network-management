! ==========================================
! THIẾT BỊ: ROUTER WEST (ASBR: EIGRP AS 66 <-> OSPF AREA 0)
! PHÂN VÙNG: BIÊN PHÍA TÂY & KIỂM SOÁT BẢO MẬT ACL 101
! ==========================================
enable
configure terminal
hostname West

! 1. Cổng LAN1 (8000 nodes -> /19)
interface FastEthernet0/0
 ip address 172.21.0.1 255.255.224.0
 no shutdown
exit

! 2. Cổng LAN2 (8000 nodes -> /19, áp dụng ACL 101 chặn ping sang VLAN east)
interface FastEthernet0/1
 ip address 172.21.32.1 255.255.224.0
 ip access-group 101 in
 no shutdown
exit

! 3. Bật cổng vật lý Gig0/0 nối Switch Server (Trunk)
interface GigabitEthernet0/0
 no ip address
 no shutdown
exit

! 4. Sub-interfaces Inter-VLAN
interface GigabitEthernet0/0.2
 encapsulation dot1Q 2
 ip address 172.23.128.2 255.255.240.0
 no shutdown
exit

interface GigabitEthernet0/0.3
 encapsulation dot1Q 3
 ip address 172.23.144.2 255.255.240.0
 no shutdown
exit

! 5. Cổng Serial0/3/0 nối WestGate (EIGRP AS 66 WAN /30)
interface Serial0/3/0
 ip address 172.21.255.2 255.255.255.252
 no shutdown
exit

! 6. Cấu hình EIGRP AS 66 & Tái phân phối từ OSPF sang
router eigrp 66
 no auto-summary
 network 172.21.0.0 0.0.31.255
 network 172.21.32.0 0.0.31.255
 network 172.21.255.0 0.0.0.3
 redistribute ospf 1 metric 10000 100 255 1 1500
exit

! 7. Cấu hình OSPF Area 0, Tái phân phối từ EIGRP sang & Bơm Tuyến Ngầm Định Vào Core
router ospf 1
 router-id 2.2.2.2
 log-adjacency-changes
 network 172.23.128.0 0.0.15.255 area 0
 network 172.23.144.0 0.0.15.255 area 0
 redistribute eigrp 66 subnets
 default-information originate
exit

! 8. Cấu hình Extended ACL 101 theo Yêu cầu 8 của đề
! - Cho phép lưu lượng HTTP (TCP 80) và TELNET (TCP 23) 2 chiều sang VLAN 'east' (172.23.144.0/20)
access-list 101 permit tcp 172.21.32.0 0.0.31.255 172.23.144.0 0.0.15.255 eq www
access-list 101 permit tcp 172.21.32.0 0.0.31.255 172.23.144.0 0.0.15.255 eq telnet
! - Chặn gói Ping (ICMP Echo) từ LAN2 sang VLAN 'east'
access-list 101 deny icmp 172.21.32.0 0.0.31.255 172.23.144.0 0.0.15.255 echo
! - Cho phép tất cả các loại lưu lượng còn lại thông mạng bình thường
access-list 101 permit ip any any

do write
