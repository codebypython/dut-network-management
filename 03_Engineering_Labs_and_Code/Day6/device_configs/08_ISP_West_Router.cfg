! ==========================================
! THIẾT BỊ: ROUTER ISP-WEST (NHÀ CUNG CẤP DỊCH VỤ PHÍA TÂY)
! PHÂN VÙNG: MÔ PHỎNG INTERNET PUBLIC PHÍA TÂY
! ==========================================
enable
configure terminal
hostname ISP-West

! 1. Cổng FastEthernet0/0 nối WestGate
interface FastEthernet0/0
 ip address 10.2.0.1 255.255.0.0
 no shutdown
exit

! 2. Loopback 0 mô phỏng máy chủ dịch vụ Web/DNS ngoài Internet
interface Loopback0
 ip address 10.10.10.10 255.255.255.255
 no shutdown
exit

do write
