! ==========================================
! THIẾT BỊ: ROUTER ISP-WEST (NHÀ CUNG CẤP DỊCH VỤ PHÍA TÂY)
! PHÂN VÙNG: MÔ PHỎNG INTERNET PUBLIC PHÍA TÂY
! ==========================================
enable
configure terminal
hostname ISP-West

! 1. Cổng Loopback0 mô phỏng máy chủ dịch vụ ngoài Internet (10.10.10.10)
interface Loopback0
 ip address 10.10.10.10 255.255.255.255
 no shutdown
exit

! 2. Cổng FastEthernet0/0 nối WestGate (10.2.0.0/16 qua DSL Modem Cloud)
interface FastEthernet0/0
 description LINK TO WESTGATE
 ip address 10.2.0.1 255.255.0.0
 duplex auto
 speed auto
 no shutdown
exit

! 3. Phân vùng Server Farm ISP Tây (Card mở rộng NM-4ESW kết nối Server Web/DNS/Mail)
interface range FastEthernet0/0/0 - 2
 switchport access vlan 69
 switchport mode access
 spanning-tree portfast
 no shutdown
exit

interface Vlan69
 ip address 10.2.0.254 255.255.0.0
 no shutdown
exit

do write
