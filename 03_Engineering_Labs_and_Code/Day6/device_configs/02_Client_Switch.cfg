! ==========================================
! THIẾT BỊ: SWITCH CLIENT (VTP CLIENT)
! PHÂN VÙNG: OSPF AREA 0 - LỚP ACCESS & DISTRIBUTION
! ==========================================
enable
configure terminal
hostname Client

! 1. Cấu hình VTP Client
vtp domain business
vtp password goodluck
vtp mode client

! 2. Cấu hình Trunking 802.1Q
! Fa0/1: Nối Switch Server (Fa0/2)
! Fa0/2: Nối Router East (Gig0/0)
interface range FastEthernet0/1 - 2
 switchport mode trunk
 switchport trunk allowed vlan 1,2,3
 no shutdown
exit

! 3. Cổng Access cho PC thuộc VLAN 3 (east)
interface FastEthernet0/10
 switchport mode access
 switchport access vlan 3
 spanning-tree portfast
 no shutdown
exit

do write
