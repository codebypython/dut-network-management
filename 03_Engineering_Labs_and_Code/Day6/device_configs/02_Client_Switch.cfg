! ==========================================
! THIẾT BỊ: SWITCH CLIENT (VTP CLIENT)
! PHÂN VÙNG: EIGRP AS 99 - SWITCH ACCESS & DISTRIBUTION PHÍA ĐÔNG
! ==========================================
enable
configure terminal
hostname Client

! 1. Khởi tạo VTP Client theo Yêu cầu 3
vtp domain business
vtp password goodluck
vtp mode client

! 2. Cấu hình Trunking chuẩn 802.1Q:
! Fa0/1: Nối Router East (Gig0/0)
! Gig0/1: Nối Switch Server (Gig0/1)
interface range FastEthernet0/1 - 2
 switchport mode trunk
 switchport trunk allowed vlan 1,2,3
 no shutdown
exit

interface GigabitEthernet0/1
 switchport mode trunk
 switchport trunk allowed vlan 1,2,3
 no shutdown
exit

! 3. Cổng Access nối máy trạm PC-East thuộc VLAN 3 ("east")
! ĐÂY LÀ ĐÍCH ĐẾN CỦA ACL 101 (Chặn ping, cho phép HTTP & Telnet)
interface FastEthernet0/10
 switchport mode access
 switchport access vlan 3
 spanning-tree portfast
 no shutdown
exit

do write
