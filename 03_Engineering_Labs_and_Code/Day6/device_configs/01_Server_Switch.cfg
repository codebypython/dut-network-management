! ==========================================
! THIẾT BỊ: SWITCH SERVER (VTP SERVER)
! PHÂN VÙNG: EIGRP AS 99 - SWITCH ACCESS & DISTRIBUTION PHÍA TÂY
! ==========================================
enable
configure terminal
hostname Server

! 1. Khởi tạo VTP Server theo Yêu cầu 3
vtp domain business
vtp password goodluck
vtp mode server

! 2. Khai báo VLANs
vlan 2
 name west
exit
vlan 3
 name east
exit

! 3. Cấu hình Trunking chuẩn 802.1Q trên các cổng Uplink:
! Fa0/1: Nối Router West (Gig0/0)
! Gig0/1: Nối Switch Client (Gig0/1)
! Gig0/2: Nối Router Core (Gig0/0)
interface range FastEthernet0/1 - 3
 switchport mode trunk
 switchport trunk allowed vlan 1,2,3
 no shutdown
exit

interface range GigabitEthernet0/1 - 2
 switchport mode trunk
 switchport trunk allowed vlan 1,2,3
 no shutdown
exit

! 4. Cổng Access nối máy trạm PC-West thuộc VLAN 2 ("west")
interface FastEthernet0/10
 switchport mode access
 switchport access vlan 2
 spanning-tree portfast
 no shutdown
exit

do write
