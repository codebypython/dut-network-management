! ==========================================
! THIẾT BỊ: SWITCH SERVER (VTP SERVER)
! PHÂN VÙNG: OSPF AREA 0 - LỚP ACCESS & DISTRIBUTION
! ==========================================
enable
configure terminal
hostname Server

! 1. Cấu hình VTP Server
vtp domain business
vtp password goodluck
vtp mode server

! 2. Khai báo danh mục VLANs
vlan 2
 name west
exit
vlan 3
 name east
exit

! 3. Cấu hình Trunking 802.1Q trên các cổng kết nối Router & Switch
! Fa0/1: Nối Router Core (Gig0/0)
! Fa0/2: Nối Switch Client (Fa0/1)
! Fa0/3: Nối Router West (Gig0/0)
interface range FastEthernet0/1 - 3
 switchport mode trunk
 switchport trunk allowed vlan 1,2,3
 no shutdown
exit

! 4. Cổng Access cho PC thuộc VLAN 2 (west)
interface FastEthernet0/10
 switchport mode access
 switchport access vlan 2
 spanning-tree portfast
 no shutdown
exit

do write
