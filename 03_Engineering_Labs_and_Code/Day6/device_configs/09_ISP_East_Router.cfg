! ==========================================
! THIẾT BỊ: ROUTER ISP-EAST (NHÀ CUNG CẤP DỊCH VỤ PHÍA ĐÔNG)
! PHÂN VÙNG: MÔ PHỎNG INTERNET PUBLIC PHÍA ĐÔNG (GOOGLE DNS)
! ==========================================
enable
configure terminal
hostname ISP-East

! 1. Cổng FastEthernet0/0 nối EastGate
interface FastEthernet0/0
 ip address 192.168.0.1 255.255.255.0
 no shutdown
exit

! 2. Loopback 0 mô phỏng máy chủ DNS Google ngoài Internet (8.8.8.8)
interface Loopback0
 ip address 8.8.8.8 255.255.255.255
 no shutdown
exit

do write
