! ==========================================
! THIẾT BỊ: ROUTER ISP-EAST (NHÀ CUNG CẤP DỊCH VỤ PHÍA ĐÔNG)
! PHÂN VÙNG: MÔ PHỎNG INTERNET PUBLIC PHÍA ĐÔNG (GOOGLE DNS)
! ==========================================
enable
configure terminal
hostname ISP-East

! 1. Cổng Loopback0 mô phỏng máy chủ Google DNS ngoài Internet (8.8.8.8)
interface Loopback0
 ip address 8.8.8.8 255.255.255.255
 no shutdown
exit

! 2. Cổng FastEthernet0/0 nối EastGate (192.168.0.0/24 qua DSL Modem Cloud)
interface FastEthernet0/0
 description LINK TO EASTGATE
 ip address 192.168.0.1 255.255.255.0
 duplex auto
 speed auto
 no shutdown
exit

! 3. Phân vùng Server Farm ISP Đông (Card mở rộng NM-4ESW kết nối Server Web/DNS/Mail)
interface range FastEthernet0/0/0 - 2
 switchport access vlan 69
 switchport mode access
 spanning-tree portfast
 no shutdown
exit

interface Vlan69
 ip address 192.168.0.254 255.255.255.0
 no shutdown
exit

do write
