! ==========================================
! THIẾT BỊ: ROUTER WESTGATE (GATEWAY KẾT NỐI ISP TÂY)
! PHÂN VÙNG: BIÊN INTERNET PHÍA TÂY & EIGRP AS 66
! ==========================================
enable
configure terminal
hostname WestGate

! 1. Cổng Loopback1 đại diện nhánh mạng LAN1 (8000 nodes -> /19) - Bên trong (NAT Inside)
interface Loopback1
 ip address 172.21.0.1 255.255.224.0
 ip nat inside
 no shutdown
exit

! 2. Cổng Serial0/3/0 nối Router West (DCE cấp Clock) - Bên trong (NAT Inside)
interface Serial0/3/0
 ip address 172.21.255.1 255.255.255.252
 clock rate 64000
 ip nat inside
 no shutdown
exit

! 3. Cổng GigabitEthernet0/0 nối ra ISP Tây (10.2.0.1/16) - Bên ngoài (NAT Outside)
interface GigabitEthernet0/0
 ip address 10.2.200.200 255.255.0.0
 ip nat outside
 no shutdown
exit

! 4. Cấu hình NAT Pool (10.2.200.201 đến 10.2.200.203/16) kèm PAT/Overload (Yêu cầu 4)
ip nat pool WEST-POOL 10.2.200.201 10.2.200.203 netmask 255.255.0.0
access-list 1 permit 172.21.0.0 0.0.255.255
access-list 1 permit 172.22.0.0 0.0.255.255
access-list 1 permit 172.23.0.0 0.0.255.255
ip nat inside source list 1 pool WEST-POOL overload

! =========================================================================
! 5. CẤU HÌNH TUYẾN NGẦM ĐỊNH BẰNG KỸ THUẬT 'ip default-network' (LƯU Ý CỦA THẦY)
! - Chỉ định mạng Class A 10.0.0.0 là mạng ngầm định (Candidate Default Network)
! - Không sử dụng lệnh tuyến tĩnh 'ip route 0.0.0.0 0.0.0.0'
! - Quảng bá mạng 10.0.0.0 vào EIGRP AS 66 thông qua câu lệnh 'network 10.0.0.0'
! =========================================================================
ip default-network 10.0.0.0

router eigrp 66
 network 10.0.0.0
 network 172.21.0.0
 network 172.21.255.0 0.0.0.3
 no auto-summary
exit

! =========================================================================
! GHI CHÚ BẢO VỆ ĐỒ ÁN / VẤN ĐÁP:
! Cơ chế: WestGate có cổng Gig0/0 nối dải 10.2.0.0/16 (thuộc mạng Lớp A chính 10.0.0.0).
! Khi có lệnh 'ip default-network 10.0.0.0' kết hợp 'network 10.0.0.0' trong EIGRP 66,
! WestGate tự động gắn cờ Candidate Default (*) vào bản tin EIGRP Update.
! Router West nhận được sẽ tự động thiết lập Gateway of last resort trỏ về WestGate
! mà hoàn toàn không cần lệnh 'redistribute static'!
! =========================================================================

do write
