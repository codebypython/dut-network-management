! ==========================================
! THIẾT BỊ: ROUTER WESTGATE (GATEWAY KẾT NỐI ISP TÂY)
! PHÂN VÙNG: BIÊN INTERNET PHÍA TÂY - NAT & DEFAULT ROUTE
! ==========================================
enable
configure terminal
hostname WestGate

! 1. Cổng Serial0/3/0 nối Router West (DCE cấp Clock) - Bên trong (NAT Inside)
interface Serial0/3/0
 ip address 172.21.255.1 255.255.255.252
 clock rate 64000
 ip nat inside
 no shutdown
exit

! 2. Cổng GigabitEthernet0/0 nối ra ISP Tây - Bên ngoài (NAT Outside)
interface GigabitEthernet0/0
 ip address 10.2.200.200 255.255.0.0
 ip nat outside
 no shutdown
exit

! 3. PHƯƠNG ÁN 1 (MẶC ĐỊNH & ỔN ĐỊNH 100%): CẤU HÌNH TUYẾN TĨNH NGẦM ĐỊNH
ip route 0.0.0.0 0.0.0.0 10.2.0.1

! 4. Cấu hình NAT Pool (10.2.200.201 đến 10.2.200.203/16) kèm Overload
ip nat pool WEST-POOL 10.2.200.201 10.2.200.203 netmask 255.255.0.0
access-list 1 permit 172.21.0.0 0.0.255.255
access-list 1 permit 172.23.0.0 0.0.255.255
ip nat inside source list 1 pool WEST-POOL overload

! 5. Cấu hình EIGRP AS 66 & Quảng bá Tuyến Ngầm Định qua 'redistribute static'
router eigrp 66
 no auto-summary
 network 172.21.255.0 0.0.0.3
 redistribute static metric 10000 100 255 1 1500
 no redistribute connected
exit

! =========================================================================
! HƯỚNG DẪN DỰ PHÒNG & VẤN ĐÁP: PHƯƠNG ÁN 2 DÙNG 'ip default-network'
! =========================================================================
! Nếu Thầy yêu cầu demo kỹ thuật ip default-network ngay tại bàn máy:
! Bước 1: Gỡ bỏ tuyến tĩnh và lệnh redistribute:
!   no ip route 0.0.0.0 0.0.0.0 10.2.0.1
!   router eigrp 66
!    no redistribute static
! Bước 2: Bật tuyến ngầm định classful:
!   ip default-network 10.0.0.0
!   router eigrp 66
!    network 10.0.0.0
! Lúc này EIGRP sẽ tự động gắn cờ Candidate Default (*) cho mạng Class A 10.0.0.0
! và quảng bá xuống Router West mà không cần redistribute static!
! =========================================================================

do write
