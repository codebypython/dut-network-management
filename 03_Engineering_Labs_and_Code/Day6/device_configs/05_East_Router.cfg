! ==========================================
! THIẾT BỊ: ROUTER EAST (ASBR: EIGRP AS 99 <-> OSPF AREA 0)
! PHÂN VÙNG: BIÊN PHÍA ĐÔNG & TRUNG TÂM PHÂN PHỐI LƯU LƯỢNG
! ==========================================
enable
configure terminal
hostname East

! 1. Cổng LAN4 (8000 nodes -> /19)
interface FastEthernet0/0
 ip address 172.22.0.1 255.255.224.0
 no shutdown
exit

! 2. Cổng LAN5 (8000 nodes -> /19)
interface FastEthernet0/1
 ip address 172.22.32.1 255.255.224.0
 no shutdown
exit

! 3. Bật cổng vật lý Gig0/0 nối Switch Client (Trunk)
interface GigabitEthernet0/0
 no ip address
 no shutdown
exit

! 4. Sub-interfaces Inter-VLAN
interface GigabitEthernet0/0.2
 encapsulation dot1Q 2
 ip address 172.23.128.3 255.255.240.0
 no shutdown
exit

interface GigabitEthernet0/0.3
 encapsulation dot1Q 3
 ip address 172.23.144.3 255.255.240.0
 no shutdown
exit

! 5. Cổng Serial0/3/0 nối EastGate (EIGRP AS 99 WAN /30)
interface Serial0/3/0
 ip address 172.22.255.2 255.255.255.252
 no shutdown
exit

! 6. Cấu hình EIGRP AS 99 & Tái phân phối từ OSPF sang
router eigrp 99
 no auto-summary
 network 172.22.0.0 0.0.31.255
 network 172.22.32.0 0.0.31.255
 network 172.22.255.0 0.0.0.3
 redistribute ospf 1 metric 10000 100 255 1 1500
exit

! 7. Cấu hình OSPF Area 0, Tái phân phối từ EIGRP sang & Bơm Tuyến Ngầm Định Vào Core
router ospf 1
 router-id 3.3.3.3
 log-adjacency-changes
 network 172.23.128.0 0.0.15.255 area 0
 network 172.23.144.0 0.0.15.255 area 0
 redistribute eigrp 99 subnets
 default-information originate
exit

do write
