! ==========================================
! THIẾT BỊ: ROUTER EAST (ASBR: OSPF AREA 0 <-> EIGRP AS 99)
! PHÂN VÙNG: BIÊN PHÍA ĐÔNG & TÁI PHÂN PHỐI ĐỊNH TUYẾN
! ==========================================
enable
configure terminal
hostname East

! 1. Cổng Loopback4 & Loopback5 đại diện nhánh mạng LAN4 và LAN5 (8000 nodes -> /19 thuộc OSPF Area 0)
interface Loopback4
 ip address 172.23.0.1 255.255.224.0
 no shutdown
exit

interface Loopback5
 ip address 172.23.32.1 255.255.224.0
 no shutdown
exit

! 2. Bật cổng vật lý Gig0/0 nối Switch Client (Trunk 802.1Q)
interface GigabitEthernet0/0
 no ip address
 duplex auto
 speed auto
 no shutdown
exit

! 3. Sub-interfaces Inter-VLAN (thuộc vùng EIGRP AS 99)
interface GigabitEthernet0/0.2
 encapsulation dot1Q 2
 ip address 172.22.32.3 255.255.240.0
 no shutdown
exit

interface GigabitEthernet0/0.3
 encapsulation dot1Q 3
 ip address 172.22.48.3 255.255.240.0
 no shutdown
exit

! 4. Cổng Serial0/3/0 nối EastGate (OSPF Area 0 WAN /30, DTE)
interface Serial0/3/0
 ip address 172.23.255.1 255.255.255.252
 no shutdown
exit

! 5. Cấu hình OSPF Area 0 & Tái phân phối từ EIGRP 99 sang
router ospf 1
 log-adjacency-changes
 network 172.23.0.0 0.0.255.255 area 0
 redistribute eigrp 99 subnets
exit

! 6. Tuyến tĩnh ngầm định trỏ sang EastGate để tái phân phối vào lõi EIGRP 99
ip route 0.0.0.0 0.0.0.0 172.23.255.2

! 7. Cấu hình EIGRP AS 99, Tái phân phối từ OSPF & Bơm Tuyến Ngầm Định Vào Core
! Ghi chú: Gán seed metric đồng nhất (10000 100 255 1 1500) giống hệt Router West
! để Router Core xuất hiện ĐỒNG THỜI 2 mục Default Route (Cân bằng tải ECMP Yêu cầu 6)
router eigrp 99
 network 172.22.0.0
 network 172.22.32.0 0.0.15.255
 network 172.22.48.0 0.0.15.255
 redistribute ospf 1 metric 10000 100 255 1 1500
 redistribute static metric 10000 100 255 1 1500
 no auto-summary
exit

do write
