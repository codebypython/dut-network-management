! ==========================================
! THIẾT BỊ: ROUTER CORE
! PHÂN VÙNG: EIGRP AS 99 (172.22.0.0/16) - TRUNG TÂM LÕI MẠNG DOANH NGHIỆP
! ==========================================
enable
configure terminal
hostname Core

! 1. Cổng Loopback3 đại diện nhánh mạng LAN3 (8000 nodes -> /19)
interface Loopback3
 ip address 172.22.0.1 255.255.224.0
 no shutdown
exit

! 2. Bật cổng vật lý Gig0/0 nối xuống Switch Server (Trunk 802.1Q)
interface GigabitEthernet0/0
 no ip address
 duplex auto
 speed auto
 no shutdown
exit

! 3. Sub-interface Inter-VLAN cho VLAN 2 ("west" - 4000 nodes -> /20)
interface GigabitEthernet0/0.2
 encapsulation dot1Q 2
 ip address 172.22.32.2 255.255.240.0
 no shutdown
exit

! 4. Sub-interface Inter-VLAN cho VLAN 3 ("east" - 4000 nodes -> /20)
interface GigabitEthernet0/0.3
 encapsulation dot1Q 3
 ip address 172.22.48.2 255.255.240.0
 no shutdown
exit

! 5. Định tuyến EIGRP AS 99
router eigrp 99
 network 172.22.0.0
 network 172.22.32.0 0.0.15.255
 network 172.22.48.0 0.0.15.255
 no auto-summary
exit

! =========================================================================
! KẾT QUẢ NGHIỆM THU YÊU CẦU 6 TRÊN CORE:
! Sau khi chạy định tuyến, lệnh 'show ip route' trên Core hiển thị ĐỒNG THỜI
! 2 mục Default Route song song (ECMP) đi ra 2 ISP:
! D*EX 0.0.0.0/0 [170/284160] via 172.22.32.1 (Gig0/0.2 - đi ISP Tây qua West)
!                [170/284160] via 172.22.32.3 (Gig0/0.2 - đi ISP Đông qua East)
! =========================================================================

do write
