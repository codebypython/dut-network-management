! ==========================================
! THIẾT BỊ: ROUTER CORE
! PHÂN VÙNG: OSPF AREA 0 - TRUNG TÂM LÕI MẠNG DOANH NGHIỆP
! ==========================================
enable
configure terminal
hostname Core

! 1. Cổng nối mạng LAN3 (8000 nodes -> /19)
interface FastEthernet0/1
 ip address 172.23.0.1 255.255.224.0
 no shutdown
exit

! 2. Bật cổng vật lý Gig0/0 nối xuống Switch Server
interface GigabitEthernet0/0
 no ip address
 no shutdown
exit

! 3. Sub-interface Inter-VLAN cho VLAN 2 (west)
interface GigabitEthernet0/0.2
 encapsulation dot1Q 2
 ip address 172.23.128.1 255.255.240.0
 no shutdown
exit

! 4. Sub-interface Inter-VLAN cho VLAN 3 (east)
interface GigabitEthernet0/0.3
 encapsulation dot1Q 3
 ip address 172.23.144.1 255.255.240.0
 no shutdown
exit

! 5. Định tuyến OSPF Area 0
router ospf 1
 router-id 1.1.1.1
 log-adjacency-changes
 network 172.23.0.0 0.0.31.255 area 0
 network 172.23.128.0 0.0.15.255 area 0
 network 172.23.144.0 0.0.15.255 area 0
exit

do write
