! ==========================================
! THIẾT BỊ: SWITCH CLIENT (VTP CLIENT & ACCESS PC0)
! ==========================================
enable
configure terminal
hostname Client

! 1. Cấu hình VTP Client
vtp domain planet
vtp password solar
vtp mode client

! 2. Bật Trunking 802.1Q trên cổng nối Server và Router Venus
interface range FastEthernet0/1 - 2
 switchport mode trunk
 switchport trunk allowed vlan 1,2,3
 no shutdown
exit

! 3. Gán cổng Fa0/10 cho PC0 (VLAN 2 mars)
interface FastEthernet0/10
 switchport mode access
 switchport access vlan 2
 no shutdown
exit

do write
