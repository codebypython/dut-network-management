! ==========================================
! THIẾT BỊ: ROUTER JUPITER (ASBR: OSPF AREA 2 <-> EIGRP AS 69)
! ==========================================
enable
configure terminal
hostname Jupiter

! 1. Chuỗi khóa xác thực EIGRP MD5
key chain EIGRP_KEY
 key 11
  key-string mouse
exit

! 2. Cổng Loopback 4 (8000 nodes -> /19)
interface loopback 4
 ip address 172.23.96.1 255.255.224.0
exit

! 3. Cổng Serial0/3/0 nối Mars (Vùng OSPF Area 2)
interface Serial0/3/0
 ip address 172.23.255.2 255.255.255.252
 ip ospf message-digest-key 1 md5 cat
 no shutdown
exit

! 4. Cổng Serial0/3/1 nối Neptune (Vùng EIGRP AS 69)
interface Serial0/3/1
 ip address 172.22.255.1 255.255.255.252
 ip authentication mode eigrp 69 md5
 ip authentication key-chain eigrp 69 EIGRP_KEY
 no shutdown
exit

! 5. Cấu hình EIGRP AS 69 & Tái phân phối từ OSPF sang
router eigrp 69
 no auto-summary
 network 172.22.255.0 0.0.0.3
 redistribute ospf 1 metric 10000 100 255 1 1500
exit

! 6. Cấu hình OSPF Area 2, Tái phân phối từ EIGRP sang & Chống bẫy Loop
router ospf 1
 router-id 4.4.4.4
 log-adjacency-changes
 area 2 authentication message-digest
 network 172.23.96.0 0.0.31.255 area 2
 network 172.23.255.0 0.0.0.3 area 2
 redistribute eigrp 69 subnets
 distance ospf external 175
 default-information originate
exit

do write
