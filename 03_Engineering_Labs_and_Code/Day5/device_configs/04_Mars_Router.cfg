! ==========================================
! THIẾT BỊ: ROUTER MARS (ABR: OSPF AREA 0 <-> AREA 2)
! ==========================================
enable
configure terminal
hostname Mars

! 1. Cổng Loopback 2 (8000 nodes -> /19)
interface loopback 2
 ip address 172.23.32.1 255.255.224.0
exit

! 2. Bật cổng vật lý Gig0/0
interface Gig0/0
 no shutdown
exit

! 3. Sub-interface VLAN 2
interface Gig0/0.2
 encapsulation dot1Q 2
 ip address 172.23.128.2 255.255.240.0
 ip ospf message-digest-key 1 md5 cat
exit

! 4. Sub-interface VLAN 3
interface Gig0/0.3
 encapsulation dot1Q 3
 ip address 172.23.144.2 255.255.240.0
 ip ospf message-digest-key 1 md5 cat
exit

! 5. Cổng WAN Serial nối Jupiter (Đầu DCE cấp Clock)
interface Serial0/3/0
 ip address 172.23.255.1 255.255.255.252
 ip ospf message-digest-key 1 md5 cat
 clock rate 64000
 no shutdown
exit

! 6. Cấu hình OSPF Đa vùng & Xác thực MD5
router ospf 1
 router-id 2.2.2.2
 log-adjacency-changes
 area 0 authentication message-digest
 area 2 authentication message-digest
 network 172.23.128.0 0.0.15.255 area 0
 network 172.23.144.0 0.0.15.255 area 0
 network 172.23.32.0 0.0.31.255 area 2
 network 172.23.255.0 0.0.0.3 area 2
exit

do write
