! ==========================================
! THIẾT BỊ: SWITCH SERVER (VTP SERVER & TRUNKING)
! ==========================================
enable
configure terminal
hostname Server

! 1. Cấu hình VTP Server
vtp domain planet
vtp password solar
vtp mode server

! 2. Khai báo VLANs
vlan 2
 name mars
vlan 3
 name venus
exit

! 3. Bật Trunking 802.1Q trên các cổng nối Earth, Mars, Client
interface range FastEthernet0/1 - 3
 switchport mode trunk
 switchport trunk allowed vlan 1,2,3
 no shutdown
exit

do write
