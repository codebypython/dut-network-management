! ==========================================
! THIẾT BỊ: ROUTER EARTH (BACKBONE OSPF AREA 0)
! ==========================================
enable
configure terminal
hostname Earth

! 1. Cổng Loopback 1 (8000 nodes -> /19)
interface loopback 1
 ip address 172.23.0.1 255.255.224.0
exit

! 2. Bật cổng vật lý Gig0/0
interface Gig0/0
 no shutdown
exit

! 3. Sub-interface VLAN 2 (mars - Tuyến chính ra Internet: Cost 1)
interface Gig0/0.2
 encapsulation dot1Q 2
 ip address 172.23.128.1 255.255.240.0
 ip ospf message-digest-key 1 md5 cat
exit

! 4. Sub-interface VLAN 3 (venus - Tuyến dự phòng: Nâng Cost 10 để triệt tiêu ECMP)
interface Gig0/0.3
 encapsulation dot1Q 3
 ip address 172.23.144.1 255.255.240.0
 ip ospf cost 10
 ip ospf message-digest-key 1 md5 cat
exit

! 5. Định tuyến OSPF Area 0 & Xác thực MD5
router ospf 1
 router-id 1.1.1.1
 log-adjacency-changes
 area 0 authentication message-digest
 network 172.23.0.0 0.0.31.255 area 0
 network 172.23.128.0 0.0.15.255 area 0
 network 172.23.144.0 0.0.15.255 area 0
exit

do write
