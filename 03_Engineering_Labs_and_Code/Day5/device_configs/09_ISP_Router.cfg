! ==========================================
! THIẾT BỊ: ROUTER ISP (GATEWAY INTERNET & SERVER FARMS)
! ==========================================
enable
configure terminal
hostname ISP

! 1. Cổng WAN nối về Cloud DSL / Router Neptune
interface FastEthernet0/0
 description LINK TO DSL CLOUD
 ip address 192.168.0.1 255.255.255.0
 duplex auto
 speed auto
 no shutdown
exit

! 2. Cấu hình SVI VLAN 69 làm Gateway cho các Máy chủ Internet
interface Vlan69
 description GATEWAY CHO GOOGLE SERVICES VA WEB
 ip address 8.8.8.9 255.255.255.0
 no shutdown
exit

! 3. Gán các cổng Switch tích hợp (HWIC-4ESW) vào VLAN 69
interface FastEthernet0/0/0
 description NOI GOOGLE DNS (8.8.8.8)
 switchport access vlan 69
 switchport mode access
 spanning-tree portfast
 no shutdown
exit

interface FastEthernet0/0/1
 description NOI GOOGLE MAIL (8.8.8.10)
 switchport access vlan 69
 switchport mode access
 spanning-tree portfast
 no shutdown
exit

interface FastEthernet0/0/2
 description NOI WEB SERVER (8.8.8.11)
 switchport access vlan 69
 switchport mode access
 spanning-tree portfast
 no shutdown
exit

! 4. Cổng Loopback 0 dự phòng (cho phép ping trực tiếp 8.8.8.8)
interface Loopback0
 ip address 8.8.8.8 255.255.255.255
 no shutdown
exit

! 5. Dịch vụ DHCP Server cấp IP Internet
ip dhcp excluded-address 6.9.6.9
ip dhcp pool Internet
 network 6.9.6.0 255.255.255.0
 default-router 6.9.6.9
 dns-server 8.8.8.8
exit

do write
