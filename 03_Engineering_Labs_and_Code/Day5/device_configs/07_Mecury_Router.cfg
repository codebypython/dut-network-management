! ==========================================
! THIẾT BỊ: ROUTER MECURY (ASBR: OSPF AREA 1 <-> EIGRP AS 69)
! ==========================================
enable
configure terminal
hostname Mecury

! 1. Chuỗi khóa xác thực EIGRP MD5
key chain EIGRP_KEY
 key 11
  key-string mouse
exit

! 2. Cổng Loopback 5 (8000 nodes -> /19 thuộc dải EIGRP 172.22.0.0/16)
interface loopback 5
 ip address 172.22.0.1 255.255.224.0
exit

! 3. Cổng Serial0/3/0 nối Venus (Vùng OSPF Area 1)
interface Serial0/3/0
 ip address 172.23.255.6 255.255.255.252
 ip ospf message-digest-key 1 md5 cat
 no shutdown
exit

! 4. Cổng Serial0/3/1 nối Neptune (Vùng EIGRP AS 69)
interface Serial0/3/1
 ip address 172.22.255.5 255.255.255.252
 ip authentication mode eigrp 69 md5
 ip authentication key-chain eigrp 69 EIGRP_KEY
 no shutdown
exit

! 5. Cấu hình EIGRP AS 69 & Tái phân phối từ OSPF sang
router eigrp 69
 no auto-summary
 network 172.22.0.0 0.0.31.255
 network 172.22.255.4 0.0.0.3
 redistribute ospf 1 metric 10000 100 255 1 1500
exit

! 6. Cấu hình OSPF Area 1 & Tái phân phối từ EIGRP sang
! Lưu ý chuẩn theo thầy giáo: Chỉ có Jupiter chạy default-information originate, Mecury KHÔNG chạy để chống loop
router ospf 1
 router-id 5.5.5.5
 log-adjacency-changes
 area 1 authentication message-digest
 network 172.23.255.4 0.0.0.3 area 1
 redistribute eigrp 69 subnets
 distance ospf external 175
exit

do write
